[package]
name = "prestashop-launcher"
version = "0.5.10"
edition = "2021"
authors = ["PrestaShop Portable Contributors"]
description = "Cross-platform launcher for PrestaShop Portable"

[dependencies]
tauri = { version = "2", features = [] }
open = "5.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
chrono = "0.4"
crossbeam-channel = "0.5"
which = "7.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
