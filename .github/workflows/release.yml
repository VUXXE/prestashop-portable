name: release-pipeline

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Launcher (Rust) builds in parallel with the native runtimes below,
  # instead of waiting for runtimes first. Hands the binary to the
  # bundle job via the launcher-bin-<target> artifact.
  build-launcher:
    name: Build Launcher (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-x86_64, os: windows-2025,   bin: prestashop-launcher.exe }
          - { target: linux-x86_64,   os: ubuntu-24.04,   bin: prestashop-launcher }
          - { target: macos-arm64,    os: macos-15,       bin: prestashop-launcher }
          - { target: macos-x86_64,   os: macos-15-intel, bin: prestashop-launcher }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-xkb-dev libfontconfig1-dev build-essential curl wget file libssl-dev xz-utils

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build Launcher Binary
        run: cargo build --release --locked -p prestashop-launcher
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-bin-${{ matrix.target }}
          path: target/release/${{ matrix.bin }}

  build-runtime:
    name: Build Runtime (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-x86_64, os: windows-2025,   ext: zip,    bin: prestashop-launcher.exe }
          - { target: linux-x86_64,   os: ubuntu-24.04,   ext: tar.xz, bin: prestashop-launcher }
          - { target: macos-arm64,    os: macos-15,       ext: tar.xz, bin: prestashop-launcher }
          - { target: macos-x86_64,   os: macos-15-intel, ext: tar.xz, bin: prestashop-launcher }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev xz-utils musl-tools

      - name: Install macOS build tools (autotools and dylibbundler)
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool pkg-config dylibbundler || true

      # 2. Cache Runtime Binaries (PHP, Nginx, MariaDB)
      - name: Cache Runtime Components
        id: cache-runtime
        uses: actions/cache@v4
        with:
          path: build/runtime/${{ matrix.target }}
          key: runtime-${{ matrix.target }}-${{ hashFiles('versions.env', 'ci/build-runtime.sh', 'ci/build-php.sh', 'ci/build-nginx.sh', 'ci/prepare-mariadb.sh') }}
          restore-keys: |
            runtime-${{ matrix.target }}-

      # 3. Build / Fetch Runtimes (Hanya jalan jika cache miss)
      - name: Build Runtime Binaries
        if: steps.cache-runtime.outputs.cache-hit != 'true'
        run: ./ci/build-runtime.sh ${{ matrix.target }}
        shell: bash
        env:
          # spc resolves sources via api.github.com (e.g. madler/zlib);
          # shared runners hit the unauthenticated rate limit (403).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4. Upload runtime for the bundle job
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.target }}
          path: build/runtime/${{ matrix.target }}

  # Packing runs per target on its native runner (after both inputs are
  # ready) so the smoke test can still execute native binaries.
  bundle:
    name: Bundle (${{ matrix.target }})
    needs: [build-launcher, build-runtime]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-x86_64, os: windows-2025,   ext: zip, bin: prestashop-launcher.exe }
          - { target: linux-x86_64,   os: ubuntu-24.04,   ext: zip, bin: prestashop-launcher }
          - { target: macos-arm64,    os: macos-15,       ext: zip, bin: prestashop-launcher }
          - { target: macos-x86_64,   os: macos-15-intel, ext: zip, bin: prestashop-launcher }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Download Launcher Binary
        uses: actions/download-artifact@v4
        with:
          name: launcher-bin-${{ matrix.target }}
          path: build/launcher-bin

      - name: Download Runtime Binaries
        uses: actions/download-artifact@v4
        with:
          name: runtime-${{ matrix.target }}
          path: build/runtime/${{ matrix.target }}

      # 5. Rakit Paket & PrestaShop Core
      - name: Package Distribution
        run: ./ci/package-bundle.sh ${{ matrix.target }} ${{ matrix.ext }}
        shell: bash
        env:
          LAUNCHER_BIN: build/launcher-bin/${{ matrix.bin }}

      # 6. Automated Smoke Test di Runner
      - name: Run Smoke Tests
        run: ./ci/smoke-test.sh ${{ matrix.target }}
        shell: bash

      # 7. Upload Artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: prestashop-portable-${{ matrix.target }}
          path: dist/*.${{ matrix.ext }}

  publish-release:
    needs: [build-launcher, build-runtime, bundle]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: prestashop-portable-*
          path: release-assets
          merge-multiple: true
      - name: Compute Checksums
        run: |
          cd release-assets
          sha256sum prestashop-portable-* > SHA256SUMS
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: release-assets/*
          generate_release_notes: true
